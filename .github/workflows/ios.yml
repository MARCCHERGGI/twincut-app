name: ios

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner label (Apple-chip runners stall when GitHub is short on capacity)"
        default: macos-26

jobs:
  test:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Generate project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Boot simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+ Pro Max" | sort -V | tail -1)
          echo "Using $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$NAME" || true
          xcrun simctl bootstatus "$NAME" -b
          xcrun simctl status_bar "$NAME" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100

      - name: Build and test
        timeout-minutes: 80
        run: |
          mkdir -p build
          # The app's own log (Log.swift), so a UI failure shows what the app did.
          xcrun simctl spawn "${{ steps.sim.outputs.name }}" log stream --level debug             --predicate 'subsystem == "com.marcohergi.reelsy" OR (process == "Twincut" AND (messageType >= 16 OR composedMessage CONTAINS[c] "present"))'             > build/app.log 2>&1 &
          cd ios
          set +e
          xcodebuild test \
            -project Reelsy.xcodeproj -scheme Reelsy \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -resultBundlePath ../build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO > ../build/xcodebuild.log 2>&1
          status=$?
          grep -E "error:|warning: .*(Reelsy|Twincut)|Test Case .*(passed|failed)|Executed|TEST (SUCCEEDED|FAILED)|BUILD (SUCCEEDED|FAILED)" ../build/xcodebuild.log | tail -n 300
          grep -E "(error|failed) .*-\[|accessibility issues|^[a-z-]+: .*\[" ../build/xcodebuild.log | head -n 60 | sed 's/^/::error::xcodebuild: /' || true
          exit $status

      - name: Smallest iPhone at largest text
        if: always()
        timeout-minutes: 20
        run: |
          SMALL=$(python3 -c "import json,re,subprocess,sys; d=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']; rt=sorted((k for k in d if 'iOS' in k), key=lambda k: [int(x) for x in re.findall(r'\d+', k)]); m=[x for k in reversed(rt) for x in d[k] if re.search(sys.argv[1], x['name'])]; print(m[0]['udid'] if m else '')" 'iPhone (SE \(3rd generation\)|1[0-9]e|1[0-9] mini)')
          echo "Using $SMALL"
          [ -n "$SMALL" ] || { echo "no small iPhone simulator on this image"; exit 1; }
          xcrun simctl boot "$SMALL" || true
          xcrun simctl bootstatus "$SMALL" -b
          cd ios
          set +e
          run_small() { rm -rf ../build/Small.xcresult; xcodebuild test             -project Reelsy.xcodeproj -scheme Reelsy             -destination "id=$SMALL"             -only-testing:ReelsyUITests/ReelsyUITests/testLayoutAtLargestText             -resultBundlePath ../build/Small.xcresult             CODE_SIGNING_ALLOWED=NO > ../build/small.log 2>&1; }
          run_small
          status=$?
          # After a long run the simulator service can drop every destination; restart it once and retry.
          if grep -q "Unable to find a device matching" ../build/small.log; then
            echo "simulator service lost its devices; restarting it"
            xcrun simctl shutdown all || true
            sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService || true
            xcrun simctl boot "$SMALL" || true
            xcrun simctl bootstatus "$SMALL" -b
            run_small
            status=$?
          fi
          grep -E "error:|Test Case .*(passed|failed)|TEST (SUCCEEDED|FAILED)" ../build/small.log | tail -n 40
          grep -E "(error|failed) .*-\[|accessibility issues|^[a-z-]+: .*\[" ../build/small.log | head -n 60 | sed 's/^/::error::small: /' || true
          exit $status

      - name: iPad (reviewers run iPhone apps there in compatibility mode)
        if: always()
        timeout-minutes: 45
        run: |
          IPAD=$(python3 -c "import json,re,subprocess,sys; d=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']; rt=sorted((k for k in d if 'iOS' in k), key=lambda k: [int(x) for x in re.findall(r'\d+', k)]); m=[x for k in reversed(rt) for x in d[k] if re.search(sys.argv[1], x['name'])]; print(m[0]['udid'] if m else '')" '^iPad (Air|Pro)')
          echo "Using $IPAD"
          [ -n "$IPAD" ] || { echo "no iPad simulator on this image"; exit 1; }
          xcrun simctl boot "$IPAD" || true
          xcrun simctl bootstatus "$IPAD" -b
          # The app's own log on the iPad, so a step that does nothing shows whether the app saw the tap.
          xcrun simctl spawn "$IPAD" log stream --level debug --predicate 'subsystem == "com.marcohergi.reelsy"' > build/ipad-app.log 2>&1 &
          cd ios
          set +e
          run_ipad() { rm -rf ../build/iPad.xcresult; xcodebuild test             -project Reelsy.xcodeproj -scheme Reelsy             -destination "id=$IPAD"             -only-testing:ReelsyUITests/ReelsyUITests/testCopySampleReel             -only-testing:ReelsyUITests/ReelsyUITests/testSettingsOpenAndShowPolicyLinks             -retry-tests-on-failure -test-iterations 2             -resultBundlePath ../build/iPad.xcresult             CODE_SIGNING_ALLOWED=NO > ../build/ipad.log 2>&1; }
          run_ipad
          status=$?
          # After a long run the simulator service can drop every destination; restart it once and retry.
          if grep -q "Unable to find a device matching" ../build/ipad.log; then
            echo "simulator service lost its devices; restarting it"
            xcrun simctl shutdown all || true
            sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService || true
            xcrun simctl boot "$IPAD" || true
            xcrun simctl bootstatus "$IPAD" -b
            run_ipad
            status=$?
          fi
          grep -E "error:|Test Case .*(passed|failed)|TEST (SUCCEEDED|FAILED)" ../build/ipad.log | tail -n 40
          grep -E "(error|failed) .*-\[|accessibility issues|^[a-z-]+: .*\[" ../build/ipad.log | head -n 60 | sed 's/^/::error::ipad: /' || true
          exit $status

      - name: Export screenshots
        if: always()
        run: |
          xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/shots || true
          xcrun xcresulttool export attachments --path build/Small.xcresult --output-path build/shots-small || true
          xcrun xcresulttool export attachments --path build/iPad.xcresult --output-path build/shots-ipad || true
          ls -la build/shots build/shots-small build/shots-ipad || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: |
            build/xcodebuild.log
            build/app.log
            build/small.log
            build/ipad.log
            build/ipad-app.log
            build/shots
            build/shots-small
            build/shots-ipad
